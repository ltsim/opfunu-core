site_name: opfunu-core
site_description: An Open-source Python Library for Optimization Benchmark Functions
site_url: https://ltsim.github.io/opfunu-core/
repo_url: https://github.com/ltsim/opfunu-core
repo_name: ltsim/opfunu-core
copyright: Copyright &copy; 2026 LTSIM

strict: true

theme:
  name: material
  palette:
    scheme: default
    primary: green
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Quick Start: quick_start.md
  - Function Categories: categories.md
  - Examples: examples.md
  - API Reference:
      - Benchmark Base Classes: benchmark.md
      - Name-based Functions:
          - A: name_based/a_func.md
          - B: name_based/b_func.md
          - C: name_based/c_func.md
          - D: name_based/d_func.md
          - E: name_based/e_func.md
          - F: name_based/f_func.md
          - G: name_based/g_func.md
          - H: name_based/h_func.md
          - I: name_based/i_func.md
          - J: name_based/j_func.md
          - K: name_based/k_func.md
          - L: name_based/l_func.md
          - M: name_based/m_func.md
          - N: name_based/n_func.md
          - O: name_based/o_func.md
          - P: name_based/p_func.md
          - Q: name_based/q_func.md
          - R: name_based/r_func.md
          - S: name_based/s_func.md
          - T: name_based/t_func.md
          - U: name_based/u_func.md
          - V: name_based/v_func.md
          - W: name_based/w_func.md
          - X: name_based/x_func.md
          - Y: name_based/y_func.md
          - Z: name_based/z_func.md
      - CEC-based Functions:
          - CEC 2005: cec_based/cec2005.md
          - CEC 2008: cec_based/cec2008.md
          - CEC 2010: cec_based/cec2010.md
          - CEC 2013: cec_based/cec2013.md
          - CEC 2014: cec_based/cec2014.md
          - CEC 2015: cec_based/cec2015.md
          - CEC 2017: cec_based/cec2017.md
          - CEC 2019: cec_based/cec2019.md
          - CEC 2020: cec_based/cec2020.md
          - CEC 2021: cec_based/cec2021.md
          - CEC 2022: cec_based/cec2022.md
      - Package-level API: integrated.md
      - Utilities: utils.md
      - Plotting: plot.md
  - Support: support.md
  - License: license.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_toc_entry: true
            show_source: false
            show_bases: false
            show_if_no_docstring: false
            separate_signature: true
            heading_level: 2
            show_category_heading: true
            group_by_category: true
            members_order: alphabetical
  - bibtex:
      bib_file: docs/references.bib
      bib_by_default: false

markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - footnotes
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
