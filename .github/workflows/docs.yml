name: Build & deploy documentation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & deploy docs (Sphinx)
    runs-on: ubuntu-latest

    # contents: write is needed by the deploy step to push the gh-pages branch;
    # on pull_request runs the deploy step is skipped, so nothing writes.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: uv sync --group docs --no-dev

      - name: Build HTML with Sphinx
        run: uv run sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Disable Jekyll processing
        run: touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_build/html
