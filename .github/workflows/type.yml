name: Type & check

on:
  pull_request:
    branches:
      - master
      - release/**

jobs:
  lint-type-check:
    name: ruff + mypy + coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group numba

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run mypy coverage
        run: uv run mypy-coverage --threshold 35 --format github
